<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Bunker - Kits Médicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-bunker">
      <div class="container-fluid">
        <a class="navbar-brand" href="Inicio.html">
          <span class="titulo-bunker fs-3 text-white">El Bunker</span>
        </a>

        <button class="navbar-toggler border-danger" type="button" data-bs-toggle="collapse" data-bs-target="#menuBunker" aria-controls="menuBunker" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuBunker">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link nav-link-bunker" href="Inicio.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-bunker" href="pagina2.html">Armas y Defensa</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-bunker active" href="pagina3.html">Kits Médicos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-bunker" href="pagina4.html">Raciones y Agua</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-bunker" href="pagina5.html">Refugios y Mapas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-bunker" href="pagina6.html">Registro de Superviviente</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
        <h1 class="titulo-bunker text-center mb-5">Kits Médicos</h1>
        <div id="contenedor-productos" class="row g-4"></div>
    </main>

    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalDetalleLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-bunker text-white">
          <div class="modal-header border-danger">
            <h5 class="modal-title titulo-bunker text-danger fs-3" id="modalTitulo">Detalles del Producto</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body text-center py-4">
            <img id="modalImagen" src="" alt="Producto" class="img-fluid rounded border border-danger mb-3" style="max-height: 220px; object-fit: cover;">
            <p id="modalDescripcion" class="text-light fs-5 px-3"></p>
            <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary px-3">
              <span id="modalPrecio" class="fw-bold text-warning fs-3"></span>
              <button type="button" class="btn btn-danger fw-bold">Añadir al Carrito</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let listaProductos = [];
      fetch('../json/KitsMédicos.json')
        .then(response => response.json())
        .then(productos => {
          listaProductos = productos;
          const contenedor = document.getElementById('contenedor-productos');
          
          productos.forEach(prod => {
            contenedor.innerHTML += `
              <div class="card card-bunker-medico h-100 text-white shadow">
                <div class="img-contenedor-medico">
                  <img src="${prod.imagen}" class="card-img-top" alt="${prod.nombre}" style="height: 200px; object-fit: contain;">
                </div>
                <div class="card-body d-flex flex-column">
                  <h5 class="card-title text-danger fw-bold fs-4 titulo-bunker">${prod.nombre}</h5>
                  <div class="mt-auto pt-3">
                    <button class="btn btn-bunker-medico w-100 py-2" onclick="verDetalles(${prod.id})">VER DETALLES</button>
                  </div>
                </div>
              </div>
            `;
          });
        })
        .catch(error => console.error('Error al cargar suministros médicos:', error));

      function verDetalles(idProducto) {
        const producto = listaProductos.find(prod => prod.id === idProducto);

        if (producto) {
          document.getElementById('modalTitulo').innerText = producto.nombre;
          document.getElementById('modalImagen').src = producto.imagen;
          document.getElementById('modalDescripcion').innerText = producto.descripcion;
          document.getElementById('modalPrecio').innerText = producto.precio;

          const modal = new bootstrap.Modal(document.getElementById('modalDetalle'));
          modal.show();
        }
      }
    </script>
</body>
</html>

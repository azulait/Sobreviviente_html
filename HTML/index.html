<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Bunker</title>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu archivo de estilos (sube un nivel desde la carpeta HTML) -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="m-0 p-0 overflow-hidden bg-dark">

    <!-- Contenedor Pantalla Completa -->
    <div class="position-relative vh-100 w-100">
        
        <!-- Imagen de Fondo en Pantalla Completa -->
        <img src="../img/Bunker_inicio.webp" alt="Portada Apocalipsis Zombie" class="w-100 h-100 object-fit-cover position-absolute top-0 start-0" style="filter: brightness(75%);"> 

        <!-- Contenido superpuesto en el centro -->
        <div class="position-absolute top-50 start-50 translate-middle text-center text-white w-100 px-3">
            <h1 class="TituloBunker fw-bold text-uppercase mb-2"> El Bunker</h1>
            
            <button type="button" class="btn btn-danger btn-lg fw-bold px-4 py-3 shadow-lg border border-2 border-light" data-bs-toggle="modal" data-bs-target="#exampleModal">
              ENTRAR A LA TIENDA DE SUMINISTROS
            </button>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-danger border-2">
          <div class="modal-header border-danger">
            <h1 class="modal-title fs-5 text-danger fw-bold" id="exampleModalLabel">⚠️ Control de infectados</h1>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center py-4">
            <p class="fs-4 fw-bold text-warning mt-2">¿Has sido mordido por un zombie ultimamente?</p>
          </div>
          <div class="modal-footer border-danger justify-content-center gap-5">
            <button type="button" class="btn btn-outline-light" onclick= "window.location.href='Inicio.html'">No</button>
            
            <button type="button" class="btn btn-danger fw-bold" onclick="window.location.href='http://www.zambranitis.com/2015/04/guia-para-suicidarte-correctamente.html'">Si</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
